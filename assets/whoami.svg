  <text x="648" y="320" fill="#374869" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">status: building · researching</text>
  <text x="648" y="338" fill="#374869" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">        learning · shipping</text>
  <text x="648" y="356" fill="#1e2540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">signal: nominal  ·  uptime: ∞</text>
