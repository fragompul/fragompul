  <text x="40" y="348" fill="#6366f1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">languages:</text>
  <text x="168" y="348" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Python · R · SQL · MATLAB · JavaScript · Java</text>

