  <!-- cat expertise.txt command -->
  <text x="40" y="254" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" filter="url(#glow)">❯ cat expertise.txt</text>

