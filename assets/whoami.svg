  <text x="40" y="312" fill="#6366f1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">genai &amp; llms:</text>
  <text x="168" y="312" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">RAG · Agents · Fine-tuning (LoRA) · Diffusion Models</text>

  <text x="40" y="330" fill="#6366f1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">mlops:</text>
