  <text x="40" y="189" fill="#374869" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">role:</text>
  <text x="168" y="189" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AI Lead @ Aapex</text>

  <text x="40" y="208" fill="#374869" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">education:</text>
