<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Francisco Javier Gómez Pulido — AI Lead &amp; Data Scientist</title>
  <desc id="desc">Dark terminal profile card with Francisco's role, research, and expertise areas.</desc>
  <defs>
    <linearGradient id="border-grad" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" rx="16" fill="#06091a"/>
  <rect x="1.5" y="1.5" width="957" height="377" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="960" height="48" rx="14" fill="#0a0e22"/>
  <rect y="34" width="960" height="14" fill="#0a0e22"/>
  <rect y="46" width="960" height="2" fill="#111528"/>
  <circle cx="32" cy="24" r="5.5" fill="#ff5f57"/>
  <circle cx="52" cy="24" r="5.5" fill="#febc2e"/>
  <circle cx="72" cy="24" r="5.5" fill="#28c840"/>
  <text x="98" y="29" fill="#29304d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">fragompul  ·  profile.sh  ·  zsh</text>

