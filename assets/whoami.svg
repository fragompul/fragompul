  <rect x="20" y="60" width="590" height="300" rx="10" fill="#090d1e" stroke="#111528" stroke-width="1.5"/>

  <!-- whoami command -->
  <text x="40" y="93" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" filter="url(#glow)">❯ whoami</text>

  <!-- Full name -->
  <text x="40" y="117" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">Francisco Javier Gómez Pulido</text>
  <text x="40" y="136" fill="#818cf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">AI Lead &amp; Data Scientist</text>

  <!-- divider -->
  <line x1="40" y1="150" x2="598" y2="150" stroke="#111528" stroke-width="1"/>

